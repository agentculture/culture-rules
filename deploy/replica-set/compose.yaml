# One dedicated mongod for the culture-rules replica set. Run on every member host
# (spark, thor, orin, spark2) with that host's replica-set.env:
#   docker compose --env-file replica-set.env up -d
# Host networking: the member address in rs-config.json is the address clients dial.
services:
  mongod:
    image: ${MONGO_IMAGE:-mongo:8.0}
    container_name: culture-rules-mongod
    network_mode: host
    restart: unless-stopped
    environment:
      MONGO_PORT: ${MONGO_PORT:-27018}
      MONGO_BIND_IP: ${MONGO_BIND_IP:-0.0.0.0}
      MONGO_REPLSET: ${MONGO_REPLSET:-culture-rules-rs}
      MONGO_CACHE_GB: ${MONGO_CACHE_GB:-1}
    volumes:
      - ${MONGO_SECRETS_DIR:-/etc/culture-rules-mongo}:/secrets:ro
      - ${MONGO_DATA_DIR:-/var/lib/culture-rules-mongo}:/data/db
    entrypoint: ["bash", "-c"]
    # mongod insists the keyFile is mode 400 and owned by its user: copy it inside the container.
    command:
      - >-
        cp /secrets/keyfile /tmp/keyfile && chmod 400 /tmp/keyfile &&
        exec mongod --replSet "$$MONGO_REPLSET" --bind_ip "$$MONGO_BIND_IP"
        --port "$$MONGO_PORT" --dbpath /data/db --wiredTigerCacheSizeGB "$$MONGO_CACHE_GB"
        --keyFile /tmp/keyfile
        --tlsMode requireTLS --tlsCertificateKeyFile /secrets/server.pem
        --tlsCAFile /secrets/ca.pem --tlsAllowConnectionsWithoutCertificates
