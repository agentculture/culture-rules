# markdownlint-cli2 config for culture-rules.
# markdownlint-cli2 stops walking at the git root, so a per-user global config
# in the home directory isn't picked up from inside the repo.
# Mirrors the guildmaster / steward / teken preset for workspace consistency.

config:
  default: true
  # MD013: Line length — disabled. Prose lines wrap at the reader.
  MD013: false
  # MD060: Table pipe spacing — disabled (stylistic preference).
  MD060: false
  # MD024: Duplicate headings — allow under different parents so Keep a
  # Changelog entries can each have ### Added / ### Changed / ### Fixed.
  MD024:
    siblings_only: true

ignores:
  - "node_modules/**"
  # The web editor's dependencies and build output (web/README.md).
  - "web/node_modules/**"
  - "web/dist/**"
  - "web/test-results/**"
  - "web/playwright-report/**"
  - ".local/**"
  - ".afi/**"
  - ".teken/**"
  # Vendored skills are cited verbatim from guildmaster — do not reformat them.
  - ".claude/skills/**"
  # .qwen/skills is a symlink onto .claude/skills (Qwen Code project-skills
  # discovery) — same files, would otherwise be double-linted under a second
  # path.
  - ".qwen/skills/**"
  - ".pi/skills/**"
  # .colleague/skills is the same symlink for colleague's skills discovery —
  # ignored for the same reason (third path onto the identical files).
  - ".colleague/skills/**"
