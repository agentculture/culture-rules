[project]
name = "culture-rules"
version = "0.18.3"
description = "Rules engine for the AgentCulture mesh: rules -> conditions -> workflows -> actions, executed by actors (agents, humans, code). Python backend library culture_rules; React Flow (Node.js) visual editor with Rules, Workflows and Actors tabs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{name = "AgentCulture"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]
dependencies = []

# Optional extras: the core library + CLI stay dependency-free (spec c40).
[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
store = ["pymongo>=4.8"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
backup = ["boto3>=1.34"]
events = ["events-cli>=0.10"]
agent = ["agentirc-cli>=9.12"]
mcp = ["mcp>=1.2,<2"]
github = ["cryptography>=42"]
discord = ["discord.py>=2.4"]

[project.urls]
Homepage = "https://github.com/agentculture/culture-rules"
Issues = "https://github.com/agentculture/culture-rules/issues"

[project.scripts]
culture-rules = "culture_rules.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["culture_rules"]

# hatch_build.py force-includes web/dist as culture_rules/web_dist (wheel and sdist).
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.1",
    "bandit>=1.7.5",
    "flake8>=6.1",
    "isort>=5.12.0",
    "black>=23.7.0",
    "teken>=0.8",
    "pyyaml>=6.0",
    "pymongo>=4.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "mcp>=1.2,<2",
    "boto3>=1.34",
    "moto[s3]>=5.0",
    "jsonschema>=4.0",
]

[tool.coverage.run]
source = ["culture_rules"]
omit = ["culture_rules/__pycache__/*"]
# Emit repo-relative paths in coverage.xml so SonarCloud maps them to
# sonar.sources=culture_rules (absolute/.venv paths fail to map → empty coverage).
relative_files = true

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["culture_rules"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "mongo: integration tests against a disposable MongoDB replica set in docker (skipped without docker)",
    "slow: builds the wheel (npm + uv); skipped when they are unavailable",
    "multihost: simulated multi-host integration and chaos tests (tests/multihost)",
]
