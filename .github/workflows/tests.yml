name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Promote SONAR_TOKEN to job env so the SonarCloud step can gate on
    # `env.SONAR_TOKEN != ''` — `secrets.*` isn't allowed in `if:`. This
    # makes the step a no-op on fork PRs (where the secret isn't injected)
    # and on any repo that hasn't configured the token yet.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Sonar needs full git history for accurate "new code" blame attribution.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - run: uv sync

      # The Mongo-backed suites (tests/store, tests/engine/test_runs_mongo.py, ...) drive a
      # real replica set through docker, which ubuntu-latest ships. Pre-pull the image so
      # they RUN here; locally, with no docker, they skip cleanly instead.
      - name: pull the MongoDB image the docker-backed tests use
        run: docker pull mongo:8.0

      # Gate 2: coverage >= 60% (--cov-fail-under; mirrors [tool.coverage.report]).
      - run: uv run pytest -n auto --cov=culture_rules --cov-fail-under=60 --cov-report=xml:coverage.xml --cov-report=term -v

      # Web coverage for SonarCloud (sonar.javascript.lcov.reportPaths): the TypeScript in
      # web/src is analysed, so its real vitest coverage must reach the gate too.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: env.SONAR_TOKEN != ''
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: web coverage (lcov)
        if: env.SONAR_TOKEN != ''
        working-directory: web
        run: |
          npm ci
          npm run test:coverage

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        # Gate 3: SonarCloud quality gate. sonar-project.properties sets
        # sonar.qualitygate.wait=true, so the scanner polls and fails this
        # step on a red gate. Skipped (not failed) only when SONAR_TOKEN is absent.

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: scan for committed secrets and non-localhost endpoints
        run: python3 scripts/scan-secrets.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - run: uv sync

      - name: black --check
        run: uv run black --check culture_rules tests

      - name: isort --check
        run: uv run isort --check-only culture_rules tests

      - name: flake8
        run: uv run flake8 culture_rules tests

      - name: bandit
        run: uv run bandit -c pyproject.toml -r culture_rules

      - name: markdownlint-cli2
        run: |
          npm install -g markdownlint-cli2@0.21.0
          markdownlint-cli2 "**/*.md" "#node_modules" "#.local" "#.claude/skills" "#.teken"

      # Gate 1: the agent-first rubric, strict.
      - name: afi rubric gate
        run: uv run teken cli doctor . --strict

  web:
    # The visual editor: typecheck, vitest, tokens + dataviz palette validator, build,
    # Playwright (mocked API), and the webglass agent-state "ready" gate (gate 4).
    # ubuntu-24.04 so the AppArmor sysctl step below applies (webglass-cli docs/ci-recipe.md).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    env:
      PLAYWRIGHT_PORT: "4174"
      WEBGLASS_PORT: "4173"
      # keep the browser cache inside the workspace (no per-user dotfile paths)
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: vitest
        run: npm test

      - name: design tokens + dataviz palette validator
        run: npm run check

      - name: build
        run: npm run build

      - name: cache Playwright browsers
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ github.workspace }}/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: playwright (keyboard walk, reduced motion, mocked API)
        run: npm run test:e2e

      - name: upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

      # webglass arm, same recipe as culture-nodes' web.yml: prove the BUILT bundle is
      # observable by an agent through the CLI alone (#agent-state reaches "ready" and
      # the page throws nothing).
      - name: install webglass-cli
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python webglass-cli

      - name: provision Chromium for webglass
        run: .venv/bin/playwright install --with-deps chromium

      - name: allow unprivileged user namespaces (Chromium sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: write the webglass policy profile for the app under test
        run: |
          cat > webglass-profile.json <<JSON
          {"name": "local-app", "declared_targets": ["127.0.0.1:${WEBGLASS_PORT}"]}
          JSON

      - name: start vite preview
        run: |
          nohup npm run preview -- --port "$WEBGLASS_PORT" --strictPort > preview.log 2>&1 &
          echo $! > preview.pid
          for _ in $(seq 1 40); do
            curl -sf "http://127.0.0.1:${WEBGLASS_PORT}/" > /dev/null && break
            sleep 0.5
          done
          curl -sf -o /dev/null "http://127.0.0.1:${WEBGLASS_PORT}/"

      - name: webglass ready - page extract '#agent-state'
        # Open the built app ONCE in an owned session, then re-read that same live page
        # (bounded) until #agent-state reports ready: re-opening a fresh page each time can
        # sample it before slow API calls settle. The web client times calls out after
        # 15 s (src/api/client.ts), so a page with no API behind it still settles.
        env:
          WEBGLASS_SESSION_OWNER: ci-ready-gate
        run: |
          .venv/bin/webglass page extract \
            --url "http://127.0.0.1:${WEBGLASS_PORT}" \
            --selector '#agent-state' \
            --policy-profile webglass-profile.json --json > webglass-extract.json
          session=$(jq -r '.content.trusted.session.session_id' webglass-extract.json)
          for attempt in $(seq 1 30); do
            if jq -e '.content.untrusted.matches | length == 1' webglass-extract.json > /dev/null \
               && jq -e '.content.untrusted.matches[0].text | fromjson | .status == "ready"' \
                  webglass-extract.json > /dev/null; then
              echo "#agent-state settled on read $attempt"
              cat webglass-extract.json
              exit 0
            fi
            sleep 1
            .venv/bin/webglass page extract --session-id "$session" \
              --selector '#agent-state' \
              --policy-profile webglass-profile.json --json > webglass-extract.json
          done
          echo "#agent-state never reached ready in 30 reads; last extract:" >&2
          cat webglass-extract.json
          exit 1

      - name: webglass console lens (no uncaught page errors)
        run: |
          .venv/bin/webglass page inspect \
            --url "http://127.0.0.1:${WEBGLASS_PORT}" \
            --lens console \
            --policy-profile webglass-profile.json --json | tee webglass-console.json
          jq -e '.lifecycle_state == "succeeded"' webglass-console.json
          jq -e '.content.untrusted.page_errors | length == 0' webglass-console.json

      - name: stop vite preview
        if: always()
        run: kill "$(cat preview.pid)" 2>/dev/null || true

      - name: upload the webglass evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webglass-evidence
          path: |
            web/webglass-extract.json
            web/webglass-console.json
            web/preview.log
          if-no-files-found: ignore

  harness-smoke:
    # All four harnesses (Claude Code, Pi/associate, colleague, Qwen Code) are
    # live for interactive use over the same clone at all times, so all four
    # configs must be correct at all times. Nothing else in CI checks more than
    # the one config `culture.yaml`'s declared backend uses.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - run: uv sync

      # `--stage all` runs three stages and prints exactly which of them really
      # ran here:
      #   config    — always runs; the load-bearing per-harness check.
      #   toolchain — steward doctor + four `guild create` dry-runs, fetched
      #               from PyPI with uvx.
      #   live      — the four documented harness invocations. A stock runner
      #               ships none of those CLIs, so this stage SKIPS and says so
      #               under "NOT VERIFIED"; it is never counted as a pass.
      # `--require config` makes a skipped config stage a hard failure.
      #
      # The script writes results to stdout and diagnostics (the NOT VERIFIED
      # and WAIVED expansions, and any failure detail) to stderr, per the
      # repo's CLI contract. Both are folded into the step summary with `2>&1`
      # so the run's honesty about what it did NOT verify stays visible there.
      - name: per-harness smoke check
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/harness-smoke.py --stage all --require config 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

  version-check:
    # Only run on PR events. On push to main after a merged PR, the comparison
    # would always fail (PR_VERSION == MAIN_VERSION because HEAD and origin/main
    # point at the same commit). Restricting the trigger avoids that.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - run: git fetch origin main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check version bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # AgentCulture rule: every PR bumps the version — even docs/config/CI.
          # See CLAUDE.md and the version-bump skill for rationale.
          PR_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          MAIN_VERSION=$(git show origin/main:pyproject.toml 2>/dev/null | python3 -c "import sys,tomllib; print(tomllib.loads(sys.stdin.read())['project']['version'])" 2>/dev/null || echo "")

          if [ -z "$MAIN_VERSION" ]; then
            echo "No pyproject.toml on main yet — skipping version check (initial scaffold)."
            exit 0
          fi

          if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
            MARKER="<!-- version-check -->"
            BODY="⚠️ **Version not bumped** — \`pyproject.toml\` still has \`$PR_VERSION\` (same as main). Bump before merging to avoid a failed PyPI publish.

          $MARKER"

            EXISTING=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
              --jq '.[] | select(.body | contains("<!-- version-check -->")) | .id' | head -1)

            if [ -n "$EXISTING" ]; then
              gh api repos/${{ github.repository }}/issues/comments/$EXISTING \
                -X PATCH -f body="$BODY" > /dev/null
            else
              gh pr comment ${{ github.event.pull_request.number }} --body "$BODY" || true
            fi

            echo "::error::Version $PR_VERSION matches main. Bump before merging."
            exit 1
          else
            echo "Version bumped: $MAIN_VERSION -> $PR_VERSION"
          fi
